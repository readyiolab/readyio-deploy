# blog.zuvigo.com: blog articles (Next.js, PM2 "readyio-blog" on 127.0.0.1:8081)
# Install:  sudo cp deploy/nginx/blog.zuvigo.com.conf /etc/nginx/sites-available/
#           sudo ln -s /etc/nginx/sites-available/blog.zuvigo.com.conf /etc/nginx/sites-enabled/
# HTTPS:    sudo certbot --nginx -d blog.zuvigo.com --redirect

upstream zuvigo_blog {
    server 127.0.0.1:8081;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name blog.zuvigo.com;
    include /etc/nginx/snippets/cloudflare-realip.conf;

    client_max_body_size 2m;

    location /_next/static/ {
        proxy_pass http://zuvigo_blog;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Only the API server (same machine) may trigger revalidation.
    location = /api/revalidate {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://zuvigo_blog;
    }

    location / {
        proxy_pass http://zuvigo_blog;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
