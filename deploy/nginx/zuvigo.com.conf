# zuvigo.com: main marketing site (Next.js, PM2 "readyio-site" on 127.0.0.1:8080)
# Install:  sudo cp deploy/nginx/zuvigo.com.conf /etc/nginx/sites-available/
#           sudo ln -s /etc/nginx/sites-available/zuvigo.com.conf /etc/nginx/sites-enabled/
# HTTPS:    sudo certbot --nginx -d zuvigo.com -d www.zuvigo.com --redirect
#           (Certbot adds the 443 listener and certificate lines to this file.)

upstream zuvigo_site {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name zuvigo.com www.zuvigo.com;
    include /etc/nginx/snippets/cloudflare-realip.conf;

    # One canonical host for SEO.
    if ($host = www.zuvigo.com) {
        return 301 https://zuvigo.com$request_uri;
    }

    client_max_body_size 2m;

    # Hashed build assets never change.
    location /_next/static/ {
        proxy_pass http://zuvigo_site;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Only the API server (same machine) may trigger revalidation.
    location = /api/revalidate {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://zuvigo_site;
    }

    location / {
        proxy_pass http://zuvigo_site;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
