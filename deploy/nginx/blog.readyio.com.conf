# blog.readyio.com: 301 Permanent Redirect to blog.zuvigo.com
# Install:  sudo cp deploy/nginx/blog.readyio.com.conf /etc/nginx/sites-available/
#           sudo ln -sf /etc/nginx/sites-available/blog.readyio.com.conf /etc/nginx/sites-enabled/
# HTTPS:    sudo certbot --nginx -d blog.readyio.com

server {
    listen 80;
    listen [::]:80;
    server_name blog.readyio.com;
    include /etc/nginx/snippets/cloudflare-realip.conf;

    # Permanent 301 redirect to the rebranded domain, preserving article slugs and query parameters
    return 301 https://blog.zuvigo.com$request_uri;
}
