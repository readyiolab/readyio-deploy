# readyio.com: 301 Permanent Redirect to zuvigo.com
# Install:  sudo cp deploy/nginx/readyio.com.conf /etc/nginx/sites-available/
#           sudo ln -sf /etc/nginx/sites-available/readyio.com.conf /etc/nginx/sites-enabled/
# HTTPS:    sudo certbot --nginx -d readyio.com -d www.readyio.com
#           (Certbot handles the HTTPS server block and redirects to https://zuvigo.com$request_uri)

server {
    listen 80;
    listen [::]:80;
    server_name readyio.com www.readyio.com;
    include /etc/nginx/snippets/cloudflare-realip.conf;

    # Permanent 301 redirect to the rebranded domain, preserving request URI and query parameters
    return 301 https://zuvigo.com$request_uri;
}
