# blogpanel.readyio.com: 301 Permanent Redirect to blogpanel.zuvigo.com
# Install:  sudo cp deploy/nginx/blogpanel.readyio.com.conf /etc/nginx/sites-available/
#           sudo ln -sf /etc/nginx/sites-available/blogpanel.readyio.com.conf /etc/nginx/sites-enabled/
# HTTPS:    sudo certbot --nginx -d blogpanel.readyio.com

server {
    listen 80;
    listen [::]:80;
    server_name blogpanel.readyio.com;
    include /etc/nginx/snippets/cloudflare-realip.conf;

    # Permanent 301 redirect to the rebranded admin panel domain
    return 301 https://blogpanel.zuvigo.com$request_uri;
}
