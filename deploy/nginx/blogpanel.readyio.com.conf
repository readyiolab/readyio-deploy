# blogpanel.readyio.com: blog admin panel (static Vite build, no Node process)
# Install:  sudo cp deploy/nginx/blogpanel.readyio.com.conf /etc/nginx/sites-available/
#           sudo ln -s /etc/nginx/sites-available/blogpanel.readyio.com.conf /etc/nginx/sites-enabled/
# HTTPS:    sudo certbot --nginx -d blogpanel.readyio.com --redirect
# Change `root` if the project is not checked out at /var/www/readyio.

server {
    listen 80;
    listen [::]:80;
    server_name blogpanel.readyio.com;
    include /etc/nginx/snippets/cloudflare-realip.conf;

    root /var/www/readyio/admin-panel/dist;
    index index.html;

    # Private tool: keep it out of search engines. index.html is revalidated on
    # every load so a new deploy is picked up immediately.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache" always;

    # Hashed Vite bundles. add_header here replaces the server-level headers.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # Client-side routing (react-router): unknown paths render the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
