# api.readyio.com: CMS + website forms API (Express, PM2 "readyio-api" on 127.0.0.1:4000)
# Install:  sudo cp deploy/nginx/api.readyio.com.conf /etc/nginx/sites-available/
#           sudo ln -s /etc/nginx/sites-available/api.readyio.com.conf /etc/nginx/sites-enabled/
# HTTPS:    sudo certbot --nginx -d api.readyio.com --redirect
# CORS is handled by Express (Backend/src/app.js); do not add CORS headers here.

upstream readyio_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.readyio.com;

    # Admin image uploads (5 MB limit in multer) and large article JSON bodies (10 MB).
    client_max_body_size 12m;

    location / {
        proxy_pass http://readyio_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # The chatbot waits on OpenRouter; uploads go through Cloudinary.
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
