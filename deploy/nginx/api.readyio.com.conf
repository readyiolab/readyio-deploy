# api.readyio.com: 301 Permanent Redirect to api.zuvigo.com
# Install:  sudo cp deploy/nginx/api.readyio.com.conf /etc/nginx/sites-available/
#           sudo ln -sf /etc/nginx/sites-available/api.readyio.com.conf /etc/nginx/sites-enabled/
# HTTPS:    sudo certbot --nginx -d api.readyio.com

server {
    listen 80;
    listen [::]:80;
    server_name api.readyio.com;
    include /etc/nginx/snippets/cloudflare-realip.conf;

    # Permanent 301 redirect to the rebranded API domain
    return 301 https://api.zuvigo.com$request_uri;
}
